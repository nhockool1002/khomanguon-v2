# Backend production trên aaPanel (mục 12 docs/khomanguon-v2-spec.html) — image build multi-stage,
# chỉ bind ra 127.0.0.1, Nginx của aaPanel đứng trước làm reverse proxy + SSL cho subdomain api.
#
# Frontend KHÔNG chạy ở đây — deploy trên Vercel (build từ thư mục frontend/, xem mục 12).
# frontend/Dockerfile vẫn giữ lại để dùng cho docker-compose.yml (dev) hoặc tự host lại sau này nếu cần.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  backend:
    build:
      context: ./backend
    restart: always
    env_file: .env.production
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      # Ảnh upload qua trình soạn bài (Phase 2, tạm — Phase 3 chuyển sang R2/S3) — mount volume
      # riêng để không mất file mỗi lần "up -d --build" thay container.
      - backend_uploads:/app/uploads
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  backend_uploads:
