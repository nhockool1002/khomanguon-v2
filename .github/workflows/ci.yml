name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: khomanguon
          POSTGRES_PASSWORD: khomanguon_ci_pass
          POSTGRES_DB: khomanguon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khomanguon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://khomanguon:khomanguon_ci_pass@localhost:5432/khomanguon?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_REFRESH_TTL_DAYS: 30
      FRONTEND_URL: http://localhost:3000
      # Cần cho encryptSecret/decryptSecret (StorageProvider secrets, SePay webhook API key) — thiếu
      # biến này thì mọi test đụng tới secret mã hoá (vd test/subscription.e2e-spec.ts webhook auth)
      # sẽ luôn thất bại ở bước decrypt, không liên quan gì tới logic thật đang test.
      STORAGE_SECRET_KEY: ci-test-storage-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Không dựa vào postinstall của @prisma/client: khi pnpm phục vụ gói từ store cache
      # (actions/setup-node cache: pnpm), nó có thể bỏ qua script postinstall, để lại
      # .prisma/client rỗng (không sinh type theo schema thật) mà không có cảnh báo nào —
      # gây lỗi "no-unsafe-*" hàng loạt ở bước Lint dù code không đổi gì liên quan.
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm run lint

      - name: Build (typecheck)
        run: pnpm run build

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed roles & permissions
        run: pnpm exec prisma db seed

      - name: Unit tests
        run: pnpm run test

      - name: E2E tests
        run: pnpm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  # Chỉ chạy khi push thẳng vào main (không chạy cho PR) và job "backend" ở trên đã xanh.
  # Yêu cầu đã deploy thủ công 1 lần theo Deploy_Checklist.md (repo đã clone sẵn ở
  # /www/wwwroot/khomanguon-v2 trên VPS, .env.production đã có) — job này chỉ pull code
  # mới + rebuild container backend + chạy migration, không tạo hạ tầng từ đầu.
  deploy-backend:
    needs: backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy backend lên aaPanel
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /www/wwwroot/khomanguon-v2
            git fetch origin main
            git reset --hard origin/main
            # --force-recreate: "up -d --build" build ra image mới nhưng Docker Compose quyết định
            # có tạo lại container hay không dựa trên hash cấu hình YAML, không phải digest image
            # thực tế — service này không khai báo "image:" cố định nên đã có ít nhất 2 lần compose
            # kết luận "không đổi gì" và để nguyên container CŨ chạy dù image build lại hoàn toàn
            # (routes/module mới của code mới không lên, phải phát hiện qua log ứng dụng).
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --force-recreate backend
            sleep 5
            echo "===== backend container logs (debug) ====="
            docker compose --env-file .env.production -f docker-compose.prod.yml logs backend --tail=200 || true
            echo "===== backend container status (debug) ====="
            docker compose --env-file .env.production -f docker-compose.prod.yml ps backend || true
            echo "===== end debug ====="
            # Gọi thẳng binary đã có sẵn trong node_modules thay vì "pnpm exec" — image runtime
            # không copy cache corepack từ stage build, nên "pnpm exec" phải tải lại pnpm qua
            # mạng mỗi lần exec, dễ bị OOM-kill (137) trên VPS RAM nhỏ khi trùng lúc container
            # vừa khởi động lại tốn thêm bộ nhớ.
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend ./node_modules/.bin/prisma migrate deploy
            # Seed idempotent (upsert permission/role/admin, chỉ tạo widget mặc định nếu bảng đang
            # rỗng) — chạy lại mỗi lần deploy để permission/seed data mới (vd "widget.manage") luôn
            # có ngay, không phải nhớ chạy tay như bước "lần đầu" trong Deploy_Checklist.md.
            # "prisma db seed" tự spawn "ts-node" theo tên trần (không phải đường dẫn) dựa vào PATH —
            # cần thêm node_modules/.bin vào PATH của lệnh exec, nếu không sẽ báo "spawn ts-node ENOENT"
            # (khác lệnh migrate deploy ở trên, tự thân không spawn thêm process con nào khác).
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T -e PATH="/app/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" backend ./node_modules/.bin/prisma db seed
