name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: khomanguon
          POSTGRES_PASSWORD: khomanguon_ci_pass
          POSTGRES_DB: khomanguon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khomanguon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://khomanguon:khomanguon_ci_pass@localhost:5432/khomanguon?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_REFRESH_TTL_DAYS: 30
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Không dựa vào postinstall của @prisma/client: khi pnpm phục vụ gói từ store cache
      # (actions/setup-node cache: pnpm), nó có thể bỏ qua script postinstall, để lại
      # .prisma/client rỗng (không sinh type theo schema thật) mà không có cảnh báo nào —
      # gây lỗi "no-unsafe-*" hàng loạt ở bước Lint dù code không đổi gì liên quan.
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm run lint

      - name: Build (typecheck)
        run: pnpm run build

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed roles & permissions
        run: pnpm exec prisma db seed

      - name: Unit tests
        run: pnpm run test

      - name: E2E tests
        run: pnpm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
