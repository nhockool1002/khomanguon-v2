name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: khomanguon
          POSTGRES_PASSWORD: khomanguon_ci_pass
          POSTGRES_DB: khomanguon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khomanguon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://khomanguon:khomanguon_ci_pass@localhost:5432/khomanguon?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_REFRESH_TTL_DAYS: 30
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Không dựa vào postinstall của @prisma/client: khi pnpm phục vụ gói từ store cache
      # (actions/setup-node cache: pnpm), nó có thể bỏ qua script postinstall, để lại
      # .prisma/client rỗng (không sinh type theo schema thật) mà không có cảnh báo nào —
      # gây lỗi "no-unsafe-*" hàng loạt ở bước Lint dù code không đổi gì liên quan.
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm run lint

      - name: Build (typecheck)
        run: pnpm run build

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed roles & permissions
        run: pnpm exec prisma db seed

      - name: Unit tests
        run: pnpm run test

      - name: E2E tests
        run: pnpm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  # Chỉ chạy khi push thẳng vào main (không chạy cho PR) và job "backend" ở trên đã xanh.
  # Yêu cầu đã deploy thủ công 1 lần theo Deploy_Checklist.md (repo đã clone sẵn ở
  # /www/wwwroot/khomanguon-v2 trên VPS, .env.production đã có) — job này chỉ pull code
  # mới + rebuild container backend + chạy migration, không tạo hạ tầng từ đầu.
  deploy-backend:
    needs: backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy backend lên aaPanel
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /www/wwwroot/khomanguon-v2
            git fetch origin main
            git reset --hard origin/main
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build backend
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend pnpm exec prisma migrate deploy
