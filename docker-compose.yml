# Dev local — hot reload qua volume mount. Dùng: `docker compose up`
# Xem docker-compose.prod.yml cho bản build multi-stage dùng khi deploy (mục 12 docs/khomanguon-v2-spec.html).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: khomanguon
      POSTGRES_PASSWORD: khomanguon_dev_pass
      POSTGRES_DB: khomanguon
    ports:
      - "5433:5432" # 5432 host thường bị chiếm bởi service khác — container-to-container vẫn dùng 5432 nội bộ
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khomanguon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm run start:dev"
    environment:
      DATABASE_URL: postgresql://khomanguon:khomanguon_dev_pass@postgres:5432/khomanguon?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      # "Xoá cache" gọi POST {FRONTEND_URL}/api/revalidate — nhưng từ trong container backend,
      # "localhost:3000" trỏ vào chính nó, không phải container frontend. Override riêng cho lượt
      # gọi này qua tên service Docker (xem backend/src/cache/frontend-revalidate.service.ts).
      FRONTEND_INTERNAL_URL: http://frontend:3000
      REVALIDATE_SECRET: dev-only-change-me-revalidate-secret
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      REVALIDATE_SECRET: dev-only-change-me-revalidate-secret
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
